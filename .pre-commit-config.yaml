repos:
- repo: https://github.com/emzeat/mz-lictools
  rev: v2.7.0
  hooks:
  - id: license-tools
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v20.1.6
  hooks:
  - id: clang-format
- repo: https://github.com/BlankSpruce/gersemi
  rev: 0.26.0
  hooks:
  - id: gersemi
    args:
      - -i
      - --indent=2
      - --list-expansion=favour-expansion
